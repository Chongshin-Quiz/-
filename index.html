<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>개혁주의 인간론 OX 퀴즈</title>
<style>
:root{
  --bg:#0b1220; --panel:#121b2d; --panel2:#18243a; --text:#f7f9fc;
  --muted:#9eb0c9; --line:#2a3b59; --blue:#4f8cff; --green:#2fd180;
  --red:#ff6b74; --yellow:#ffd166; --shadow:0 20px 60px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(180deg,#09111f,#101a2b);color:var(--text);min-height:100vh}
button,select{font:inherit}
.wrap{width:min(920px,calc(100% - 28px));margin:0 auto;padding:28px 0 64px}
header{padding:18px 4px 8px}
.badge{display:inline-flex;padding:7px 10px;border-radius:999px;background:#17305d;color:#9fc1ff;font-size:13px;font-weight:800;letter-spacing:.02em}
h1{font-size:clamp(30px,6vw,52px);line-height:1.08;margin:16px 0 10px}
.lead{color:var(--muted);line-height:1.6;margin:0}
.card{background:rgba(18,27,45,.95);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.weekBtn,.modeBtn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:14px;padding:14px 10px;font-weight:800;cursor:pointer}
.weekBtn.active,.modeBtn.active{background:#244a88;border-color:#4f8cff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
select{width:100%;padding:14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.primary{width:100%;border:0;background:var(--blue);color:white;font-weight:900;padding:16px 18px;border-radius:16px;cursor:pointer;margin-top:14px}
.secondary{border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:800;padding:12px 14px;border-radius:14px;cursor:pointer}
.hidden{display:none!important}
.quizTop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.progressTrack{height:9px;background:#0b1424;border-radius:999px;overflow:hidden;margin:16px 0 0}
.progressBar{height:100%;width:0;background:linear-gradient(90deg,#4f8cff,#6ba0ff)}
.meta{font-size:13px;color:var(--muted)}
.question{font-size:clamp(24px,4.5vw,38px);line-height:1.45;font-weight:900;margin:28px 0}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ox button{min-height:150px;border-radius:24px;border:2px solid var(--line);background:#101a2a;color:white;font-weight:1000;font-size:70px;cursor:pointer}
.ox .o:hover{border-color:var(--green);background:#133226}
.ox .x:hover{border-color:var(--red);background:#35171d}
.feedback{margin-top:16px;border-radius:16px;padding:15px 16px;font-weight:800;line-height:1.6}
.correct{background:rgba(47,209,128,.13);border:1px solid rgba(47,209,128,.45);color:#9ff0c6}
.wrong{background:rgba(255,107,116,.13);border:1px solid rgba(255,107,116,.45);color:#ffb1b6}
.next{margin-top:12px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--panel2);border:1px solid var(--line);padding:16px;border-radius:16px;text-align:center}
.stat b{font-size:28px;display:block}
.wrongList{display:grid;gap:10px;margin-top:16px}
.wrongItem{padding:14px 16px;border-radius:14px;background:#101a2a;border:1px solid var(--line);line-height:1.5}
.wrongItem small{color:var(--muted)}
footer{color:#6e8099;text-align:center;font-size:12px;margin-top:26px}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}.ox button{min-height:120px}.card{padding:18px}.statgrid{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <span class="badge">이상웅 교수 강의 기준 · 1–6주차</span>
  <h1>개혁주의 인간론<br>OX 퀴즈</h1>
  <p class="lead">주차별·전체 랜덤으로 풀고, 틀린 문제만 다시 복습할 수 있습니다. 기록은 이 기기에 자동 저장됩니다.</p>
</header>

<section id="setup" class="card">
  <h2>범위 선택</h2>
  <div class="grid" id="weekGrid">
    <button class="weekBtn active" data-week="all">전체 140</button>
    <button class="weekBtn" data-week="1">1주차</button>
    <button class="weekBtn" data-week="2">2주차</button>
    <button class="weekBtn" data-week="3">3주차</button>
    <button class="weekBtn" data-week="4">4주차</button>
    <button class="weekBtn" data-week="5">5주차</button>
    <button class="weekBtn" data-week="6">6주차</button>
    <button class="weekBtn" data-week="trap">함정 20제</button>
    <button class="weekBtn" data-week="wrong">오답노트</button>
  </div>

  <h2 style="margin-top:22px">출제 방식</h2>
  <div class="row">
    <select id="count">
      <option value="10">10문제</option>
      <option value="20" selected>20문제</option>
      <option value="30">30문제</option>
      <option value="all">범위 전체</option>
    </select>
    <select id="order">
      <option value="random" selected>랜덤 출제</option>
      <option value="seq">순서대로</option>
    </select>
  </div>
  <button id="startBtn" class="primary">퀴즈 시작</button>
  <div style="margin-top:14px;padding:13px 14px;border-radius:14px;background:#0f1a2c;border:1px solid #2a3b59;color:#9eb0c9;line-height:1.55;font-size:13px">
    <strong style="color:#f7f9fc">Safari 사용</strong><br>
    이 파일은 Safari 호환입니다. GitHub Pages에 올리면 일반 웹주소로 열 수 있고 홈 화면에도 추가할 수 있습니다.
  </div>
  <div class="meta" id="savedInfo" style="margin-top:12px"></div>
</section>

<section id="quiz" class="card hidden">
  <div class="quizTop">
    <div>
      <div class="meta" id="scopeText"></div>
      <strong id="counter"></strong>
    </div>
    <button class="secondary" id="quitBtn">나가기</button>
  </div>
  <div class="progressTrack"><div class="progressBar" id="progress"></div></div>
  <div class="question" id="questionText"></div>
  <div class="ox" id="oxButtons">
    <button class="o" data-answer="O">O</button>
    <button class="x" data-answer="X">X</button>
  </div>
  <div id="feedback" class="feedback hidden"></div>
  <button id="nextBtn" class="primary next hidden">다음 문제</button>
</section>

<section id="result" class="card hidden">
  <span class="badge">RESULT</span>
  <h2 style="font-size:34px;margin-bottom:4px">채점 결과</h2>
  <div class="statgrid">
    <div class="stat"><b id="scorePct">0%</b><span>정답률</span></div>
    <div class="stat"><b id="scoreRaw">0/0</b><span>정답</span></div>
    <div class="stat"><b id="wrongRaw">0</b><span>오답</span></div>
  </div>
  <div class="row" style="margin-top:14px">
    <button class="secondary" id="retryWrong">이번 오답만 다시</button>
    <button class="secondary" id="homeBtn">범위 다시 선택</button>
  </div>
  <div class="wrongList" id="wrongList"></div>
</section>

<footer>정리 기준: 개혁주의 인간론 1–6주차 강의 및 시험공부용 요약자료</footer>
</div>

<script>

const TRAPS = [{"id": "T1", "week": "함정", "q": "역사적 아담을 인정하려면 반드시 지구의 나이를 약 6천 년으로 보아야 한다.", "a": "X", "exp": "역사적 아담의 실재와 정확한 창조 연대 계산은 구별됩니다. 교수님은 젊은 지구 연대를 필수 교리로 고정하지 않습니다."}, {"id": "T2", "week": "함정", "q": "인간과 동물 사이에 생물학적 유사성이 있다는 사실 자체는 개혁주의 인간론과 모순된다.", "a": "X", "exp": "생물학적 유사성 자체는 인정할 수 있습니다. 문제는 그 유사성을 인간과 동물의 동일성이나 역사적 아담 부정으로 곧바로 연결하는 것입니다."}, {"id": "T3", "week": "함정", "q": "ṣelem과 demût은 인간에게 주어진 서로 완전히 다른 두 부분이다.", "a": "X", "exp": "ṣelem과 demût은 서로 완전히 다른 두 부분이 아니라 병행적으로 이해됩니다."}, {"id": "T4", "week": "함정", "q": "타락 후 인간은 하나님의 형상을 완전히 잃어 더 이상 하나님의 형상이 아니다.", "a": "X", "exp": "타락 후에도 광의의 하나님의 형상은 남아 있습니다. 다만 협의의 형상은 상실되고 광의의 형상도 죄의 영향을 받습니다."}, {"id": "T5", "week": "함정", "q": "협의의 형상은 참된 지식·의·거룩과 관계된다.", "a": "O", "exp": "강의 기준으로 맞습니다. 이 문장은 시험에서 반대로 뒤집어 X로 만들기 쉬운 핵심 구별입니다."}, {"id": "T6", "week": "함정", "q": "광의의 형상이 남아 있다는 것은 자연인의 이성이 죄로부터 완전히 자유롭다는 뜻이다.", "a": "X", "exp": "광의의 형상이 남아 있어도 자연인의 이성과 도덕성은 죄의 영향을 받습니다."}, {"id": "T7", "week": "함정", "q": "전적 타락은 모든 인간이 실제로 가능한 최악의 수준까지 악하다는 뜻이다.", "a": "X", "exp": "전적 타락은 ‘최대한 악함’이 아니라 ‘전 존재가 죄의 영향을 받음’을 뜻합니다."}, {"id": "T8", "week": "함정", "q": "일반은총은 전적 타락 교리를 부정하기 위해 도입되는 개념이다.", "a": "X", "exp": "일반은총은 전적 타락을 부정하는 것이 아니라, 타락한 인간에게도 시민적 선과 문화적 탁월성이 나타나는 이유를 설명합니다."}, {"id": "T9", "week": "함정", "q": "교수님은 인간을 단순한 삼분설보다 구조적 이원성과 영육통일체로 이해한다.", "a": "O", "exp": "강의 기준으로 맞습니다. 이 문장은 시험에서 반대로 뒤집어 X로 만들기 쉬운 핵심 구별입니다."}, {"id": "T10", "week": "함정", "q": "구약은 행위언약 시대이고 신약은 은혜언약 시대이다.", "a": "X", "exp": "행위언약/은혜언약의 구분을 구약/신약과 동일시하면 안 됩니다."}, {"id": "T11", "week": "함정", "q": "창 1–3장에 berit가 직접 없으므로 행위언약이라고 부를 근거가 전혀 없다.", "a": "X", "exp": "창 1–3장에 berit라는 단어가 없어도 언약의 구성요소가 존재한다는 것이 교수님의 설명입니다."}, {"id": "T12", "week": "함정", "q": "John Murray가 ‘행위언약’이라는 명칭을 선호하지 않았다는 것은 그가 아담의 시험과 대표성을 모두 부정했다는 뜻이다.", "a": "X", "exp": "John Murray는 명칭을 선호하지 않았지만 아담의 시험·대표성 등 교리적 실체를 전부 부정한 것은 아닙니다."}, {"id": "T13", "week": "함정", "q": "타락 이후 인간은 행위언약의 요구에 완전히 순종함으로 자기 힘으로 영생을 얻을 수 있다.", "a": "X", "exp": "타락 이후 인간은 자신의 순종으로 영생을 획 let selectedWeek = "all";
let active = [], idx = 0, correct = 0, currentAnswered = false, sessionWrong = [];

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function getWrongIds(){
  try{return JSON.parse(localStorage.getItem("anthroWrong")||"[]")}catch(e){return []}
}
function saveWrong(id){
  const ids=new Set(getWrongIds()); ids.add(String(id));
  localStorage.setItem("anthroWrong", JSON.stringify([...ids]));
}
function clearWrong(id){
  const ids=getWrongIds().filter(x=>x!==String(id));
  localStorage.setItem("anthroWrong", JSON.stringify(ids));
}
function stats(){
  let s={};
  try{s=JSON.parse(localStorage.getItem("anthroStats")||"{}")}catch(e){}
  return s;
}
function saveStats(){
  const s=stats();
  s.played=(s.played||0)+1; s.correct=(s.correct||0)+correct; s.total=(s.total||0)+active.length;
  localStorage.setItem("anthroStats",JSON.stringify(s));
}
function updateSavedInfo(){
  const s=stats(), w=getWrongIds().length;
  $("#savedInfo").textContent = `누적 풀이 ${s.played||0}회 · 누적 정답 ${(s.correct||0)}/${(s.total||0)} · 저장된 오답 ${w}개`;
}
updateSavedInfo();

$$(".weekBtn").forEach(btn=>btn.addEventListener("click",()=>{
  $$(".weekBtn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active"); selectedWeek=btn.dataset.week;
}));

function shuffle(a){
  const arr=[...a];
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
  return arr;
}
function pool(){
  if(selectedWeek==="trap") return TRAPS.map(x=>({...x}));
  if(selectedWeek==="wrong"){
    const ids=new Set(getWrongIds());
    return [...QUESTIONS,...TRAPS].filter(q=>ids.has(String(q.id)));
  }
  if(selectedWeek==="all") return QUESTIONS.map(x=>({...x}));
  return QUESTIONS.filter(q=>String(q.week)===selectedWeek).map(x=>({...x}));
}
function start(custom=null){
  let p=custom ? [...custom] : pool();
  if(!p.length){ alert("저장된 오답이 없습니다."); return; }
  const order=$("#order").value;
  if(order==="random") p=shuffle(p);
  const c=$("#count").value;
  if(!custom && c!=="all") p=p.slice(0,Math.min(+c,p.length));
  active=p; idx=0; correct=0; sessionWrong=[]; currentAnswered=false;
  $("#setup").classList.add("hidden"); $("#result").classList.add("hidden"); $("#quiz").classList.remove("hidden");
  render();
}
$("#startBtn").addEventListener("click",()=>start());

function render(){
  const q=active[idx];
  currentAnswered=false;
  $("#feedback").className="feedback hidden";
  $("#nextBtn").classList.add("hidden");
  $$("#oxButtons button").forEach(b=>{b.disabled=false;b.style.opacity="1"});
  $("#counter").textContent=`${idx+1} / ${active.length}`;
  $("#scopeText").textContent = q.week==="함정" ? "함정 20제" : `${q.week}주차 · 문제 ${q.id}`;
  $("#progress").style.width=`${((idx)/active.length)*100}%`;
  $("#questionText").textContent=q.q;
}
$$("#oxButtons button").forEach(btn=>btn.addEventListener("click",()=>{
  if(currentAnswered) return;
  currentAnswered=true;
  const q=active[idx], user=btn.dataset.answer, ok=user===q.a;
  if(ok){ correct++; clearWrong(q.id); }
  else { saveWrong(q.id); sessionWrong.push(q); }
  $("#feedback").classList.remove("hidden");
  $("#feedback").classList.add(ok?"correct":"wrong");
  $("#feedback").innerHTML = ok
   ? `정답입니다. <strong>${q.a}</strong>`
   : `오답입니다. 정답은 <strong>${q.a}</strong> 입니다.<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);font-weight:700"><span style="color:#ffd166">핵심 해설</span><br>${escapeHtml(q.exp||"")}</div>`;
  $$("#oxButtons button").forEach(b=>b.disabled=true);
  $("#nextBtn").classList.remove("hidden");
}));
$("#nextBtn").addEventListener("click",()=>{
  if(idx<active.length-1){idx++;render()} else finish();
});
$("#quitBtn").addEventListener("click",()=>{ if(confirm("퀴즈를 종료할까요?")) home(); });

function finish(){
  saveStats();
  $("#progress").style.width="100%";
  $("#quiz").classList.add("hidden"); $("#result").classList.remove("hidden");
  const pct=Math.round(correct/active.length*100);
  $("#scorePct").textContent=`${pct}%`;
  $("#scoreRaw").textContent=`${correct}/${active.length}`;
  $("#wrongRaw").textContent=sessionWrong.length;
  const box=$("#wrongList"); box.innerHTML="";
  if(sessionWrong.length){
    const h=document.createElement("h3"); h.textContent="이번에 틀린 문제"; box.appendChild(h);
    sessionWrong.forEach(q=>{
      const d=document.createElement("div"); d.className="wrongItem";
      d.innerHTML=`<small>${q.week==="함정"?"함정":q.week+"주차"} · ${q.id}</small><br>${escapeHtml(q.q)}<br><strong>정답 ${q.a}</strong><br><span style="color:#ffd166">해설</span> ${escapeHtml(q.exp||"")}`;
      box.appendChild(d);
    });
  } else {
    const d=document.createElement("div"); d.className="wrongItem"; d.textContent="전부 맞았습니다."; box.appendChild(d);
  }
  updateSavedInfo();
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function home(){
  $("#quiz").classList.add("hidden"); $("#result").classList.add("hidden"); $("#setup").classList.remove("hidden"); updateSavedInfo();
}
$("#homeBtn").addEventListener("click",home);
$("#retryWrong").addEventListener("click",()=>{
  if(!sessionWrong.length){alert("이번 세션 오답이 없습니다.");return}
  start(sessionWrong);
});
</script>
